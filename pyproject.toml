[project]
name = "personal-growth-agent"
version = "0.1.0"
description = "Local-first personal growth execution system"
requires-python = ">=3.10"
dependencies = [
    "prompt_toolkit>=3.0",
    "rich>=13.0",
]

[project.scripts]
pga = "personal_growth_agent.cli:main"

[tool.setuptools.packages.find]
include = ["personal_growth_agent", "personal_growth_agent.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
